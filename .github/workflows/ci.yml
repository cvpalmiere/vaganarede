name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-e-testes:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      DOCUMENT_HASH_SALT: ${{ secrets.DOCUMENT_HASH_SALT }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      STRIPE_PRICE_ID_EMPRESA: ${{ secrets.STRIPE_PRICE_ID_EMPRESA }}
      STRIPE_PRICE_ID_EMPRESA_RH: ${{ secrets.STRIPE_PRICE_ID_EMPRESA_RH }}
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ secrets.NEXT_PUBLIC_WHATSAPP_NUMBER }}
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
      WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
      SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
      SEED_ADMIN_SENHA: ${{ secrets.SEED_ADMIN_SENHA }}
      SEED_EMPRESA_EMAIL: ${{ secrets.SEED_EMPRESA_EMAIL }}
      SEED_EMPRESA_SENHA: ${{ secrets.SEED_EMPRESA_SENHA }}
      SEED_EMPRESA_CNPJ: ${{ secrets.SEED_EMPRESA_CNPJ }}
      SEED_EMPRESA_RH_EMAIL: ${{ secrets.SEED_EMPRESA_RH_EMAIL }}
      SEED_EMPRESA_RH_SENHA: ${{ secrets.SEED_EMPRESA_RH_SENHA }}
      SEED_EMPRESA_RH_CNPJ: ${{ secrets.SEED_EMPRESA_RH_CNPJ }}
      E2E_BYPASS_KEY: ${{ secrets.E2E_BYPASS_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Instalar navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: Subir servidor de producao em segundo plano
        run: npm run start &

      - name: Esperar o servidor responder
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Rodar testes E2E
        run: npm run test:e2e

      - name: Publicar relatorio de teste (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
